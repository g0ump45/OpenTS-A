name: Engine nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-nightly
  cancel-in-progress: false

jobs:
  activity:
    name: Check for new commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # The public nightly download link resolves the latest successful scheduled
      # run, so a quiet night must not conclude successfully with no artifacts.
      # A scheduled run that finds nothing new cancels itself, leaving the last
      # real build as the latest successful nightly. A run started by hand always
      # builds.
      - name: Cancel the run when nothing new landed
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          committed="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" \
            --jq '.commit.committer.date')"
          age=$(( $(date --utc +%s) - $(date --utc -d "${committed}" +%s) ))
          echo "Last commit ${committed}, $(( age / 3600 ))h ago."
          # The window is a little over a day, so a run that starts late still sees the
          # commits of the day it covers.
          if [ "${age}" -ge 90000 ]; then
            echo "Nothing new since the last nightly; cancelling this run."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"
            # Hold the job open until the cancellation lands; failing is the
            # fallback so a no-op run never concludes successful.
            sleep 300
            exit 1
          fi

  build:
    name: Build
    needs: activity
    uses: ./.github/workflows/engine-build.yml
    with:
      artifact-prefix: opents-nightly
